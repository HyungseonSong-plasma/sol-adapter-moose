name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'a0.1-*'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Rust workspace is not present on this revision; bootstrap workflow only."
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.workspace.outputs.present == 'true'
        with:
          toolchain: 1.80.0
          components: rustfmt, clippy
      - name: Verify dependency lock
        if: steps.workspace.outputs.present == 'true'
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Formatting
        if: steps.workspace.outputs.present == 'true'
        run: cargo fmt --all --check
      - name: Tests
        if: steps.workspace.outputs.present == 'true'
        run: cargo test --workspace --locked
      - name: Clippy
        if: steps.workspace.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
