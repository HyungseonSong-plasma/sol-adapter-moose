name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'a0.1-*'
  workflow_dispatch:
    inputs:
      run_conda_compatibility:
        description: "Explicitly opt in to deferred exact-Conda compatibility checks"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      backend_needed: ${{ steps.changes.outputs.backend_needed }}
      parity_needed: ${{ steps.changes.outputs.parity_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate active Samuel binding and immutable central capabilities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root = Path('docs/operating_system')
          manifest = json.loads((root / 'central_skills.json').read_text(encoding='utf-8'))
          alias = json.loads(Path('docs/operations/chatgpt-operation-binding.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 2
          assert manifest['source_repository'] == 'HyungseonSong-plasma/chatgpt-operation'
          os_data = manifest['operating_system']
          assert os_data['revision'] == '059050330a549fce0b543687e2e9d4dca6c3f624'
          assert os_data['expected_version'] == 'Samuel'
          assert re.fullmatch(r'[0-9a-f]{40}', os_data['revision'])
          assert alias['operating_system']['repository'] == manifest['source_repository']
          assert alias['operating_system']['revision'] == os_data['revision']
          assert alias['operating_system']['expected_version'] == os_data['expected_version']
          assert alias['operating_system']['index'] == os_data['index']['path']
          assert alias['central_manifest'] == 'docs/operating_system/central_skills.json'
          assert alias['skill_catalog'] == manifest['skill_catalog']['path']
          assert alias['capability_registry'] == manifest['capability_registry']['path']
          init = {s['name']: s for s in manifest['skills'] if 'INIT' in s['load_on']}
          assert set(init) == {'session-bootstrap', 'state-refresh'}
          assert [init[n]['path'] for n in ('session-bootstrap', 'state-refresh')] == alias['working_set']['init']
          for key in ('index', 'essential_rules'):
              assert re.fullmatch(r'[0-9a-f]{40}', os_data[key]['expected_blob_sha'])
          for item in manifest['skills']:
              assert item['revision'] == os_data['revision']
              assert re.fullmatch(r'[0-9a-f]{40}', item['expected_blob_sha'])
          for key in ('skill_catalog', 'capability_registry'):
              assert re.fullmatch(r'[0-9a-f]{40}', manifest[key]['expected_blob_sha'])
          print('Samuel local binding and manifest consistency: OK')
          PY
          central_rev="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('docs/operating_system/central_skills.json').read_text())['operating_system']['revision'])
          PY
          )"
          central_dir="$(mktemp -d)"
          trap 'rm -rf "$central_dir"' EXIT
          git -C "$central_dir" init -q
          git -C "$central_dir" remote add origin https://github.com/HyungseonSong-plasma/chatgpt-operation.git
          git -C "$central_dir" fetch --quiet --depth=1 origin "$central_rev"
          python3 - "$central_dir" "$central_rev" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          central, revision = sys.argv[1:]
          data = json.loads(Path('docs/operating_system/central_skills.json').read_text(encoding='utf-8'))
          items = [data['operating_system']['index'], data['operating_system']['essential_rules'], data['skill_catalog'], data['capability_registry']] + data['skills']
          def git(*args):
              return subprocess.check_output(['git', '-C', central, *args], text=True).strip()
          for item in items:
              path, sha = item['path'], item['expected_blob_sha']
              actual = git('rev-parse', f'{revision}:{path}')
              if actual != sha:
                  raise SystemExit(f'Samuel blob mismatch: {path}: expected {sha}, got {actual}')
          os_index = git('show', f'{revision}:{data["operating_system"]["index"]["path"]}')
          rules = git('show', f'{revision}:{data["operating_system"]["essential_rules"]["path"]}')
          assert '**Current version name:** Samuel' in os_index and '`Samuel` is ACTIVE.' in os_index
          assert '# Samuel Essential Rules' in rules
          catalog = json.loads(git('show', f'{revision}:{data["skill_catalog"]["path"]}'))
          registry = json.loads(git('show', f'{revision}:{data["capability_registry"]["path"]}'))
          declared = {s['name']: s for s in data['skills']}
          active = {s['name']: s for s in catalog['skills']}
          for name, record in declared.items():
              assert name in active and record['path'] == active[name]['path']
              assert set(record['load_on']) == set(active[name]['load_on'])
          for capability in ('GITHUB_PR_MERGE', 'GITHUB_BRANCH_DELETE', 'GITHUB_WORKFLOW_DISPATCH'):
              providers = registry['capabilities'][capability]['providers']
              assert providers and providers == sorted(providers, key=lambda item: item['priority'])
              assert registry['capabilities'][capability]['exhaustion_policy'] == 'all_registered_providers_must_fail'
          print(f'Samuel pinned artifact blobs + catalog/capability routing verified: {len(items)} objects')
          PY
      - name: Classify backend-relevant change
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              echo "backend_needed=true" >> "$GITHUB_OUTPUT"
              echo "parity_needed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Differential parity requires the pinned Python oracle, not MOOSE.
          if git diff --quiet "$base" "$head" -- \
              src/hit.rs \
              tests/hit_structural_editing.rs \
              tests/hit_b1_parity.rs \
              tests/parity/b1_legacy_oracle.py; then
            echo "parity_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "parity_needed=true" >> "$GITHUB_OUTPUT"
          fi
          # HIT text editing is independent of the executable backend. Apply this
          # decision to both pull_request and push (including merge commits), or
          # main would attempt the unrelated external MOOSE package installation.
          # Any other Rust/backend change still triggers the real MOOSE gate.
          if python3 - "$base" "$head" <<'PY'
          import subprocess
          import sys

          base, head = sys.argv[1:]
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, head, "--"], text=True
          ).splitlines())
          isolated = {
              ".github/workflows/rust-ci.yml",
              "src/hit.rs",
              "src/lib.rs",
              "tests/hit_structural_editing.rs",
              "tests/hit_b1_parity.rs",
              "tests/parity/b1_legacy_oracle.py",
          }
          hit_changes = {
              "src/hit.rs",
              "tests/hit_structural_editing.rs",
              "tests/hit_b1_parity.rs",
              "tests/parity/b1_legacy_oracle.py",
          }
          if not changed or not changed <= isolated or not changed & hit_changes:
              sys.exit(1)

          def at(ref, path):
              return subprocess.check_output(["git", "show", f"{ref}:{path}"])

          old_lib = at(base, "src/lib.rs")
          new_lib = at(head, "src/lib.rs")
          if "src/lib.rs" in changed:
              marker = b"pub mod execution_v02;\n"
              if old_lib.count(marker) != 1:
                  sys.exit(1)
              if new_lib != old_lib.replace(marker, marker + b"pub mod hit;\n", 1):
                  sys.exit(1)
          elif new_lib != old_lib:
              sys.exit(1)

          # A new dependency from a backend/realization module onto HIT editing
          # must be validated as a backend change, not silently exempted.
          other_sources = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", head, "--", "src"], text=True
          ).splitlines()
          for path in other_sources:
              if not path.endswith(".rs") or path in {"src/hit.rs", "src/lib.rs"}:
                  continue
              content = at(head, path)
              if b"crate::hit" in content or b"sol_adaptor_moose::hit" in content:
                  sys.exit(1)

          print("Isolated B1 HIT change; MOOSE executable backend unaffected")
          PY
          then
            echo "backend_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$base" "$head" -- \
              Cargo.toml \
              Cargo.lock \
              rust-toolchain.toml \
              src \
              tests/hit_structural_editing.rs \
              tests/moose_probe.rs \
              tests/moose_ir_check.rs \
              tests/moose_realization_v02_check.rs \
              tests/moose_execution_v02.rs \
              tests/moose_backend_workspace.rs \
              tests/phase5_conformance.rs \
              tests/phase5_thermal_vv.rs \
              tests/fixtures/backend; then
            echo "backend_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend_needed=true" >> "$GITHUB_OUTPUT"
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Rust workspace is not present on this revision; bootstrap workflow only."
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.workspace.outputs.present == 'true'
        with:
          toolchain: 1.80.0
          components: rustfmt, clippy
      - name: Verify dependency lock
        if: steps.workspace.outputs.present == 'true'
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Formatting
        if: steps.workspace.outputs.present == 'true'
        run: cargo fmt --all --check
      - name: Tests
        if: steps.workspace.outputs.present == 'true'
        run: cargo test --workspace --locked
      - name: Clippy
        if: steps.workspace.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  hit-parity:
    needs: [scope]
    if: needs.scope.outputs.parity_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact legacy Physics source
        uses: actions/checkout@v4
        with:
          repository: HyungseonSong-plasma/moose-test-repo
          ref: ea3e63ba4e4edd75e8227748e185ddd5fbb106d8
          path: .parity/physics
          sparse-checkout: |
            physics_harness/adapters/moose
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Verify immutable Python oracle source
        run: |
          test "$(git -C .parity/physics rev-parse HEAD)" =             ea3e63ba4e4edd75e8227748e185ddd5fbb106d8
          test -f .parity/physics/physics_harness/adapters/moose/input.py
          test -f .parity/physics/physics_harness/adapters/moose/blocks.py
          test -f .parity/physics/physics_harness/adapters/moose/parameters.py
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.80.0
      - name: Execute pinned Python / Rust differential
        env:
          PHYSICS_B1_SOURCE_ROOT: .parity/physics
        run: cargo test --test hit_b1_parity --locked -- --nocapture

  # Physics OCI is the Thermal 0.2 default and mandatory Native gate.
  # Exact-Conda remains a distinct historical compatibility check, suspended
  # on routine PR/push runs and available only by explicit manual opt-in.
  physics-oci-thermal:
    name: Physics OCI native Thermal + pinned SOL Runtime parity
    needs: [scope, rust]
    if: needs.scope.outputs.backend_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SOL_MOOSE_NATIVE_OCI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate commit
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.80.0
      - name: Pull exact published Physics Runtime (not INL Conda)
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/hyungseonsong-plasma/physics-runtime@sha256:cda9f0d09a17aed5fa606e97d1ee5c3450f7280536cec2e5c635402bb07d972c'
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = '9f388366ccf38b9c34542ec5561198249fde0ac9'
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.physics.build-base.ref" }}')" = 'ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008'
      - name: Execute real Adapter OCI Thermal P2/P3 (direct path)
        shell: bash
        run: |
          set -euo pipefail
          unset SOL_MOOSE_EXECUTABLE SOL_MOOSE_CONDA_PREFIX
          export SOL_MOOSE_WORKSPACE_ROOT="$PWD/target/physics-oci-native"
          cargo test --test physics_oci_native --locked -- --nocapture
          test -s target/physics-oci-evidence/direct-result.json
          test -s target/physics-oci-native/runs/direct-thermal-oci-001/input.i
          grep -Fq 'Solve Converged!' target/physics-oci-native/runs/direct-thermal-oci-001/stdout.log
      - uses: actions/checkout@v4
        with:
          repository: HyungseonSong-plasma/simulation-ontology
          ref: 020e9a979a0b97f2af3cf54758cedf38fecb187a
          path: .sol-v02-runtime
          persist-credentials: false
      - name: Run actual pinned SOL Runtime -> Adapter -> Physics OCI P2/P3
        shell: bash
        env:
          SOL_SHA: 020e9a979a0b97f2af3cf54758cedf38fecb187a
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          unset SOL_MOOSE_EXECUTABLE SOL_MOOSE_CONDA_PREFIX
          test "$(git -C .sol-v02-runtime rev-parse HEAD)" = "$SOL_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          cargo build --locked --bin sol-adaptor-moose
          cargo build --locked --manifest-path .sol-v02-runtime/examples/external-runtime-v02/Cargo.toml
          mkdir -p target/physics-oci-sol-consumer
          jq -n --slurpfile plan tests/fixtures/sol/0.2/thermal-realization-request.json \
            '{target:"moose",required_capabilities:["thermal.steady_conduction"],plan_request:$plan[0]}' \
            > target/physics-oci-sol-consumer/request.json
          consumer="$PWD/.sol-v02-runtime/examples/external-runtime-v02/target/debug/sol-external-runtime-v02-consumer"
          adapter="$PWD/target/debug/sol-adaptor-moose"
          export SOL_MOOSE_WORKSPACE_ROOT="$PWD/target/physics-oci-sol-workspace"
          "$consumer" run "$adapter" target/physics-oci-sol-consumer/request.json \
            > target/physics-oci-sol-consumer/result.json \
            2> target/physics-oci-sol-consumer/stderr.log
          python3 scripts/verify_physics_oci_sol_thermal_parity.py \
            --external-result target/physics-oci-sol-consumer/result.json \
            --external-workspace target/physics-oci-sol-workspace \
            --direct-input target/physics-oci-native/runs/direct-thermal-oci-001/input.i \
            --request target/physics-oci-sol-consumer/request.json \
            --adapter-sha "$HEAD_SHA" --runtime-sha "$SOL_SHA" \
            --output target/physics-oci-sol-consumer/parity.json
      - name: Load exact shared Thermal verifier from Draft PR 38
        shell: bash
        env:
          VERIFIER_SOURCE_COMMIT: fd813490a0f2275175ee64f96f7f23851814254b
          VERIFIER_SOURCE_BLOB: 35029268d543e37302a52a582d3e19c6a6c7782d
        run: |
          set -euo pipefail
          # PR #38 owns the single verifier implementation until merged.
          # Fetch the pinned commit without changing this PR's exact HEAD.
          git fetch --no-tags --depth=1 origin "$VERIFIER_SOURCE_COMMIT"
          actual_blob=$(git rev-parse "$VERIFIER_SOURCE_COMMIT:scripts/verify_thermal_same_run_evidence.py")
          test "$actual_blob" = "$VERIFIER_SOURCE_BLOB"
          git show "$VERIFIER_SOURCE_COMMIT:scripts/verify_thermal_same_run_evidence.py" \
            > "$RUNNER_TEMP/verify_thermal_same_run_evidence.py"
          test "$(git hash-object "$RUNNER_TEMP/verify_thermal_same_run_evidence.py")" = "$VERIFIER_SOURCE_BLOB"
          echo "THERMAL_SOURCE_VERIFIER=$RUNNER_TEMP/verify_thermal_same_run_evidence.py" >> "$GITHUB_ENV"
          echo "SHARED_VERIFIER_SOURCE_PIN=PASS commit=$VERIFIER_SOURCE_COMMIT blob=$VERIFIER_SOURCE_BLOB"
      - name: OCI Phase5 independent numerical V&V and same-run CSV/Exodus field
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          unset SOL_MOOSE_EXECUTABLE SOL_MOOSE_CONDA_PREFIX
          cargo test --test physics_oci_phase5_vv --locked -- --nocapture
          root=target/physics-oci-phase5/phase5-vv-evidence
          test -s "$root/thermal-vv.json"
          test -s "$root/runs/thermal-constant-field-vv/input_out.csv"
          test -s "$root/runs/thermal-constant-field-vv/input_out.e"
          python3 -m pip install --disable-pip-version-check 'scipy==1.14.1'
          python3 "$THERMAL_SOURCE_VERIFIER" \
            --evidence-root "$root" \
            --required-backend-profile physics_oci_thermal_v1 \
            --output "$root/thermal-same-run-source-evidence.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path(
              "target/physics-oci-phase5/phase5-vv-evidence/thermal-same-run-source-evidence.json"
          ).read_text())
          assert r["status"] == "NATIVE_SOURCE_SCALAR_FIELD_PAIR_VERIFIED"
          assert r["canonical_result_semantics"] == "NOT_EVALUATED"
          assert r["science_owner_signoff"] == "PENDING"
          assert r["adapter_protocol_result_0_3"] == "NOT_IMPLEMENTED"
          assert r["source_checkout_state"] == "EXACT_HEAD_OBSERVED_IN_CI"
          print("OCI_THERMAL_NUMERICAL_SOURCE_VV=PASS; SCIENCE_SIGNOFF=PENDING")
          PY
      - name: Same-run CSV mutation must fail source-level V&V
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, shutil
          from pathlib import Path
          source = Path("target/physics-oci-phase5/phase5-vv-evidence")
          altered = Path("target/physics-oci-phase5-negative/phase5-vv-evidence")
          shutil.copytree(source, altered)
          csvpath = altered / "runs/thermal-constant-field-vv/input_out.csv"
          with csvpath.open(newline="") as file:
              rows = list(csv.reader(file))
          index = rows[0].index("temperature_max_vv")
          rows[-1][index] = str(float(rows[-1][index]) + 5.0)
          with csvpath.open("w", newline="") as file:
              writer = csv.writer(file)
              writer.writerows(rows)
          PY
          if python3 "$THERMAL_SOURCE_VERIFIER" \
            --evidence-root target/physics-oci-phase5-negative/phase5-vv-evidence \
            --required-backend-profile physics_oci_thermal_v1 \
            --output target/physics-oci-phase5-negative/should-not-exist.json \
            >target/physics-oci-phase5-negative/negative.log 2>&1; then
            echo 'OCI_NUMERICAL_MUTATION_UNEXPECTED_PASS' >&2
            exit 1
          fi
          test ! -e target/physics-oci-phase5-negative/should-not-exist.json
          grep -Fq 'scalar/field numerical extrema differ' \
            target/physics-oci-phase5-negative/negative.log
          echo 'OCI_NUMERICAL_MUTATION=REJECTED_AS_EXPECTED'
      - name: Negative mutation must not pass parity
        shell: bash
        env:
          SOL_SHA: 020e9a979a0b97f2af3cf54758cedf38fecb187a
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cp target/physics-oci-native/runs/direct-thermal-oci-001/input.i target/physics-oci-sol-consumer/tampered.i
          printf '\n# deliberate mismatch\n' >> target/physics-oci-sol-consumer/tampered.i
          if python3 scripts/verify_physics_oci_sol_thermal_parity.py \
            --external-result target/physics-oci-sol-consumer/result.json \
            --external-workspace target/physics-oci-sol-workspace \
            --direct-input target/physics-oci-sol-consumer/tampered.i \
            --request target/physics-oci-sol-consumer/request.json \
            --adapter-sha "$HEAD_SHA" --runtime-sha "$SOL_SHA" \
            --output target/physics-oci-sol-consumer/should-not-exist.json \
            > target/physics-oci-sol-consumer/negative.log 2>&1; then
            echo 'INVALID_PARITY_UNEXPECTED_PASS' >&2
            exit 1
          fi
          grep -Fq 'different HIT bytes' target/physics-oci-sol-consumer/negative.log
          test ! -e target/physics-oci-sol-consumer/should-not-exist.json
          echo 'OCI_PARITY_NEGATIVE_REJECTED'
      - name: Persist exact-backend execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-oci-thermal-native-parity-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            target/physics-oci-phase5/phase5-vv-evidence/thermal-vv.json
            target/physics-oci-phase5/phase5-vv-evidence/thermal-same-run-source-evidence.json
            target/physics-oci-phase5/phase5-vv-evidence/runs/*/input.i
            target/physics-oci-phase5/phase5-vv-evidence/runs/*/*.csv
            target/physics-oci-phase5/phase5-vv-evidence/runs/*/*.e
            target/physics-oci-phase5/phase5-vv-evidence/runs/*/*.log
            target/physics-oci-phase5-negative/negative.log
            target/physics-oci-evidence/*.json
            target/physics-oci-native/runs/*/input.i
            target/physics-oci-native/runs/*/*.log
            target/physics-oci-sol-consumer/*
            target/physics-oci-sol-workspace/runs/*/input.i
            target/physics-oci-sol-workspace/runs/*/*.log
  # Deferred, explicitly selected only; no longer blocks the default OCI
  # Thermal CI. Failure remains a real FAIL when deliberately requested.
  moose-backend:
    name: Deferred exact-Conda release compatibility (manual only)
    needs: [scope, rust]
    if: github.event_name == 'workflow_dispatch' && inputs.run_conda_compatibility == true && needs.scope.outputs.backend_needed == 'true'
    runs-on: ubuntu-latest
    env:
      SOL_MOOSE_BACKEND_PROFILE: conda
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.80.0
      - name: Install Miniforge
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/miniforge.sh" \
            https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash "$RUNNER_TEMP/miniforge.sh" -b -p "$RUNNER_TEMP/miniforge"
          echo "$RUNNER_TEMP/miniforge/bin" >> "$GITHUB_PATH"
      - name: Install exact MOOSE evidence target
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/miniforge/bin/conda" create -y \
            -p "$RUNNER_TEMP/moose-env" \
            --override-channels \
            -c https://conda.software.inl.gov/public \
            -c conda-forge \
            'moose=2026.08.12=mpich'
          echo "SOL_MOOSE_EXECUTABLE=$RUNNER_TEMP/moose-env/bin/moose-opt" >> "$GITHUB_ENV"
          echo "SOL_MOOSE_CONDA_PREFIX=$RUNNER_TEMP/moose-env" >> "$GITHUB_ENV"
          mkdir -p target
          "$RUNNER_TEMP/miniforge/bin/conda" list -p "$RUNNER_TEMP/moose-env" --json \
            > target/phase1-conda-list.json
          metadata=$(find "$RUNNER_TEMP/moose-env/conda-meta" -maxdepth 1 \
            -name 'moose-*.json' -print -quit)
          test -n "$metadata"
          cp "$metadata" target/phase1-moose-conda-meta.json
      - name: Verify retained package archive when available
        shell: bash
        run: |
          set -euo pipefail
          expected='d7b2eec6b958f11455c903b70a16ea319b7edb68b4499537313c06785abd05b3'
          archive=$(find "$RUNNER_TEMP/miniforge/pkgs" -maxdepth 1 \
            -name 'moose-2026.08.12-mpich.conda' -print -quit || true)
          if [[ -n "$archive" ]]; then
            actual=$(sha256sum "$archive" | awk '{print $1}')
            printf 'expected=%s\nactual=%s\narchive=%s\n' "$expected" "$actual" "$archive" \
              | tee target/phase1-package-sha256.txt
            test "$actual" = "$expected"
          else
            printf 'expected=%s\narchive=not-retained-by-conda-cache\n' "$expected" \
              | tee target/phase1-package-sha256.txt
          fi
      - name: Exact backend probe and input validation
        run: cargo test --test moose_probe --locked -- --nocapture
      - name: Generated IR backend input validation
        run: cargo test --test moose_ir_check --locked -- --nocapture
      - name: Canonical thermal 0.2 translation validation
        run: cargo test --test moose_realization_v02_check --locked -- --nocapture
      - name: Protocol 0.2 authoritative thermal execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/phase4-execution-evidence
          cargo test --test moose_execution_v02 --locked -- --nocapture 2>&1 \
            | tee target/phase4-execution-evidence/protocol-test.log
      - name: Backend-only workspace execution
        run: cargo test --test moose_backend_workspace --locked -- --nocapture
      - name: Phase 5 external-process conformance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/phase5-conformance
          cargo test --test phase5_conformance --locked -- --nocapture 2>&1 \
            | tee target/phase5-conformance/test.log
          test -f target/phase5-conformance/realization-v02-report.json
      - name: Phase 5 steady thermal numerical V&V
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/phase5-vv-evidence
          cargo test --test phase5_thermal_vv --locked -- --nocapture 2>&1 \
            | tee target/phase5-vv-evidence/test.log
          test -f target/phase5-vv-evidence/thermal-vv.json
      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moose-backend-evidence
          if-no-files-found: warn
          path: |
            target/phase1-moose-probe.json
            target/phase1-moose-conda-meta.json
            target/phase1-conda-list.json
            target/phase1-package-sha256.txt
            target/phase2-generated/*.i
            target/phase3-realization-v02/*.i
            target/phase4-execution-evidence/protocol-test.log
            target/phase4-execution-evidence/runs/thermal-realization-001/input.i
            target/phase4-execution-evidence/runs/thermal-realization-001/check.stdout.log
            target/phase4-execution-evidence/runs/thermal-realization-001/check.stderr.log
            target/phase4-execution-evidence/runs/thermal-realization-001/stdout.log
            target/phase4-execution-evidence/runs/thermal-realization-001/stderr.log
            target/backend-workspace-evidence/runs/backend-only-diffusion/input.i
            target/backend-workspace-evidence/runs/backend-only-diffusion/stdout.log
            target/backend-workspace-evidence/runs/backend-only-diffusion/stderr.log
            target/phase5-conformance/test.log
            target/phase5-conformance/realization-v02-report.json
            target/phase5-conformance/adapter-workspace/runs/*/input.i
            target/phase5-conformance/adapter-workspace/runs/*/check.stdout.log
            target/phase5-conformance/adapter-workspace/runs/*/check.stderr.log
            target/phase5-conformance/adapter-workspace/runs/*/stdout.log
            target/phase5-conformance/adapter-workspace/runs/*/stderr.log
            target/phase5-vv-evidence/test.log
            target/phase5-vv-evidence/thermal-vv.json
            target/phase5-vv-evidence/runs/thermal-constant-field-vv/input.i
            target/phase5-vv-evidence/runs/thermal-constant-field-vv/*.csv
            target/phase5-vv-evidence/runs/thermal-constant-field-vv/stdout.log
            target/phase5-vv-evidence/runs/thermal-constant-field-vv/stderr.log
