name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'a0.1-*'

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      backend_needed: ${{ steps.changes.outputs.backend_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate active Paul binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("docs/operations/chatgpt-operation-binding.json").read_text(encoding="utf-8"))
          os_meta=data["operating_system"]
          assert os_meta["repository"] == "HyungseonSong-plasma/chatgpt-operation"
          assert os_meta["revision"] == "e6df2c89578ee7b5c23f043a0aa2f7fe9cbd9499"
          assert os_meta["expected_version"] == "Paul"
          assert data["working_set"]["init"] == [
              "skills/session-bootstrap/README.md",
              "skills/state-refresh/README.md",
          ]
          assert data["skill_catalog"] == "skills/catalog.json"
          assert data["conditional_skills"]["github_actions_observation"] == [
              "skills/github-actions-observation/README.md",
          ]
          assert data["conditional_skills"]["github_actions_execution"] == [
              "skills/github-actions-execution/README.md",
          ]
          PY
          central_dir="$(mktemp -d)"
          git -C "$central_dir" init -q
          git -C "$central_dir" remote add origin https://github.com/HyungseonSong-plasma/chatgpt-operation.git
          git -C "$central_dir" fetch --quiet --depth=1 origin e6df2c89578ee7b5c23f043a0aa2f7fe9cbd9499
          git -C "$central_dir" show e6df2c89578ee7b5c23f043a0aa2f7fe9cbd9499:docs/operating_system/README.md | grep -Fq '**Current version name:** Paul'
          git -C "$central_dir" cat-file -e e6df2c89578ee7b5c23f043a0aa2f7fe9cbd9499:docs/operating_system/ESSENTIAL_RULES.md
          git -C "$central_dir" cat-file -e e6df2c89578ee7b5c23f043a0aa2f7fe9cbd9499:skills/session-bootstrap/README.md
          git -C "$central_dir" cat-file -e e6df2c89578ee7b5c23f043a0aa2f7fe9cbd9499:skills/state-refresh/README.md
          git -C "$central_dir" cat-file -e e6df2c89578ee7b5c23f043a0aa2f7fe9cbd9499:skills/github-actions-observation/README.md
          git -C "$central_dir" cat-file -e e6df2c89578ee7b5c23f043a0aa2f7fe9cbd9499:skills/github-actions-execution/README.md
          git -C "$central_dir" cat-file -e e6df2c89578ee7b5c23f043a0aa2f7fe9cbd9499:skills/catalog.json
          rm -rf "$central_dir"
      - name: Classify backend-relevant change
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              echo "backend_needed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if git diff --quiet "$base" "$head" -- \
              Cargo.toml \
              Cargo.lock \
              rust-toolchain.toml \
              src \
              tests/moose_probe.rs \
              tests/moose_ir_check.rs \
              tests/moose_realization_v02_check.rs \
              tests/moose_execution_v02.rs \
              tests/moose_backend_workspace.rs \
              tests/phase5_conformance.rs \
              tests/phase5_thermal_vv.rs \
              tests/fixtures/backend; then
            echo "backend_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend_needed=true" >> "$GITHUB_OUTPUT"
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Rust workspace is not present on this revision; bootstrap workflow only."
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.workspace.outputs.present == 'true'
        with:
          toolchain: 1.80.0
          components: rustfmt, clippy
      - name: Verify dependency lock
        if: steps.workspace.outputs.present == 'true'
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Formatting
        if: steps.workspace.outputs.present == 'true'
        run: cargo fmt --all --check
      - name: Tests
        if: steps.workspace.outputs.present == 'true'
        run: cargo test --workspace --locked
      - name: Clippy
        if: steps.workspace.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  moose-backend:
    needs: [scope, rust]
    if: needs.scope.outputs.backend_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.80.0
      - name: Install Miniforge
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/miniforge.sh" \
            https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash "$RUNNER_TEMP/miniforge.sh" -b -p "$RUNNER_TEMP/miniforge"
          echo "$RUNNER_TEMP/miniforge/bin" >> "$GITHUB_PATH"
      - name: Install exact MOOSE evidence target
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/miniforge/bin/conda" create -y \
            -p "$RUNNER_TEMP/moose-env" \
            --override-channels \
            -c https://conda.software.inl.gov/public \
            -c conda-forge \
            'moose=2026.08.12=mpich'
          echo "SOL_MOOSE_EXECUTABLE=$RUNNER_TEMP/moose-env/bin/moose-opt" >> "$GITHUB_ENV"
          echo "SOL_MOOSE_CONDA_PREFIX=$RUNNER_TEMP/moose-env" >> "$GITHUB_ENV"
          mkdir -p target
          "$RUNNER_TEMP/miniforge/bin/conda" list -p "$RUNNER_TEMP/moose-env" --json \
            > target/phase1-conda-list.json
          metadata=$(find "$RUNNER_TEMP/moose-env/conda-meta" -maxdepth 1 \
            -name 'moose-*.json' -print -quit)
          test -n "$metadata"
          cp "$metadata" target/phase1-moose-conda-meta.json
      - name: Verify retained package archive when available
        shell: bash
        run: |
          set -euo pipefail
          expected='d7b2eec6b958f11455c903b70a16ea319b7edb68b4499537313c06785abd05b3'
          archive=$(find "$RUNNER_TEMP/miniforge/pkgs" -maxdepth 1 \
            -name 'moose-2026.08.12-mpich.conda' -print -quit || true)
          if [[ -n "$archive" ]]; then
            actual=$(sha256sum "$archive" | awk '{print $1}')
            printf 'expected=%s\nactual=%s\narchive=%s\n' "$expected" "$actual" "$archive" \
              | tee target/phase1-package-sha256.txt
            test "$actual" = "$expected"
          else
            printf 'expected=%s\narchive=not-retained-by-conda-cache\n' "$expected" \
              | tee target/phase1-package-sha256.txt
          fi
      - name: Exact backend probe and input validation
        run: cargo test --test moose_probe --locked -- --nocapture
      - name: Generated IR backend input validation
        run: cargo test --test moose_ir_check --locked -- --nocapture
      - name: Canonical thermal 0.2 translation validation
        run: cargo test --test moose_realization_v02_check --locked -- --nocapture
      - name: Protocol 0.2 authoritative thermal execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/phase4-execution-evidence
          cargo test --test moose_execution_v02 --locked -- --nocapture 2>&1 \
            | tee target/phase4-execution-evidence/protocol-test.log
      - name: Backend-only workspace execution
        run: cargo test --test moose_backend_workspace --locked -- --nocapture
      - name: Phase 5 external-process conformance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/phase5-conformance
          cargo test --test phase5_conformance --locked -- --nocapture 2>&1 \
            | tee target/phase5-conformance/test.log
          test -f target/phase5-conformance/realization-v02-report.json
      - name: Phase 5 steady thermal numerical V&V
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/phase5-vv-evidence
          cargo test --test phase5_thermal_vv --locked -- --nocapture 2>&1 \
            | tee target/phase5-vv-evidence/test.log
          test -f target/phase5-vv-evidence/thermal-vv.json
      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moose-backend-evidence
          if-no-files-found: warn
          path: |
            target/phase1-moose-probe.json
            target/phase1-moose-conda-meta.json
            target/phase1-conda-list.json
            target/phase1-package-sha256.txt
            target/phase2-generated/*.i
            target/phase3-realization-v02/*.i
            target/phase4-execution-evidence/protocol-test.log
            target/phase4-execution-evidence/runs/thermal-realization-001/input.i
            target/phase4-execution-evidence/runs/thermal-realization-001/check.stdout.log
            target/phase4-execution-evidence/runs/thermal-realization-001/check.stderr.log
            target/phase4-execution-evidence/runs/thermal-realization-001/stdout.log
            target/phase4-execution-evidence/runs/thermal-realization-001/stderr.log
            target/backend-workspace-evidence/runs/backend-only-diffusion/input.i
            target/backend-workspace-evidence/runs/backend-only-diffusion/stdout.log
            target/backend-workspace-evidence/runs/backend-only-diffusion/stderr.log
            target/phase5-conformance/test.log
            target/phase5-conformance/realization-v02-report.json
            target/phase5-conformance/adapter-workspace/runs/*/input.i
            target/phase5-conformance/adapter-workspace/runs/*/check.stdout.log
            target/phase5-conformance/adapter-workspace/runs/*/check.stderr.log
            target/phase5-conformance/adapter-workspace/runs/*/stdout.log
            target/phase5-conformance/adapter-workspace/runs/*/stderr.log
            target/phase5-vv-evidence/test.log
            target/phase5-vv-evidence/thermal-vv.json
            target/phase5-vv-evidence/runs/thermal-constant-field-vv/input.i
            target/phase5-vv-evidence/runs/thermal-constant-field-vv/*.csv
            target/phase5-vv-evidence/runs/thermal-constant-field-vv/stdout.log
            target/phase5-vv-evidence/runs/thermal-constant-field-vv/stderr.log
