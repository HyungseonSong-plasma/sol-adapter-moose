name: Official SOL Contract SDK adapter parity candidate

on:
  pull_request:
    paths:
      - "scripts/compare-official-sol-sdk-candidate.py"
      - ".github/workflows/sol-sdk-parity-candidate.yml"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-sdk-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.80.1
        run: |
          rustup toolchain install 1.80.1 --profile minimal --component rustfmt
          rustup default 1.80.1
      - name: Check Python syntax
        run: python3 -m py_compile scripts/compare-official-sol-sdk-candidate.py
      - name: Compare vendor baseline against immutable upstream SDK
        env:
          CARGO_TERM_COLOR: never
        run: |
          python3 scripts/compare-official-sol-sdk-candidate.py --evidence-dir "$RUNNER_TEMP/sol-adapter-sdk-parity"
      - name: Upload candidate parity evidence (not official signoff)
        uses: actions/upload-artifact@v4
        with:
          name: sol-adapter-sdk-parity-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/sol-adapter-sdk-parity/
          if-no-files-found: error
          retention-days: 30
